<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Belief-Graph — Map Replay</title>
<style>
  :root {
    --bg: #050914;
    --bg-grid: #0d1a33;
    --panel: #0a1428;
    --panel-line: #16305c;
    --laser: #2fd4ff;
    --laser-soft: #0e5f7a;
    --laser-glow: rgba(47, 212, 255, 0.55);
    --danger: #ff3b5c;
    --danger-glow: rgba(255, 59, 92, 0.65);
    --confirm: #35ffb0;
    --text: #d8ecff;
    --text-dim: #6f92bf;
    --mono: "IBM Plex Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(47,212,255,0.10), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--mono);
    padding: 32px 24px 60px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  header {
    border-bottom: 1px solid var(--panel-line);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  .eyebrow {
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--laser); margin-bottom: 8px;
    text-shadow: 0 0 8px var(--laser-glow);
  }
  h1 {
    font-size: 28px; margin: 0 0 6px; letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 0 14px var(--laser-glow), 0 0 2px #fff;
  }
  .subtitle { color: var(--text-dim); font-size: 13px; }
  .status-line { font-size: 11px; margin: 14px 0 22px; }
  .status-line.ok { color: var(--confirm); text-shadow: 0 0 6px rgba(53,255,176,0.5); }
  .status-line.err { color: var(--danger); }

  #stage {
    position: relative;
    width: 100%;
    height: 480px;
    background:
      repeating-linear-gradient(var(--bg-grid) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, var(--bg-grid) 0 1px, transparent 1px 34px),
      #060b18;
    border: 1px solid var(--laser-soft);
    box-shadow: inset 0 0 60px rgba(47,212,255,0.08), 0 0 24px rgba(47,212,255,0.06);
    margin-bottom: 20px;
    overflow: hidden;
  }

  .room-box {
    position: absolute;
    width: 190px;
    height: 130px;
    border: 1.5px solid var(--laser-soft);
    background: rgba(10, 20, 40, 0.7);
    font-size: 11px;
    padding: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    transition: box-shadow 0.3s, border-color 0.3s, background 0.3s;
  }
  .room-box .room-label {
    font-weight: 700; font-size: 13px; color: var(--text);
    margin-bottom: 4px; text-transform: capitalize; letter-spacing: 0.5px;
  }
  .room-box.current-room {
    border-color: var(--laser);
    background: rgba(15, 45, 70, 0.85);
    box-shadow: 0 0 18px var(--laser-glow), inset 0 0 18px rgba(47,212,255,0.15);
  }
  .room-box.flash {
    animation: flashRed 0.9s ease-in-out 2;
  }
  @keyframes flashRed {
    0%, 100% { border-color: var(--laser); box-shadow: 0 0 18px var(--laser-glow); background: rgba(15,45,70,0.85); }
    50% { border-color: var(--danger); box-shadow: 0 0 26px var(--danger-glow); background: rgba(60,10,20,0.85); }
  }

  .corridor {
    position: absolute;
    background: linear-gradient(90deg, transparent, var(--laser-soft), transparent);
    box-shadow: 0 0 10px rgba(47,212,255,0.35);
  }

  #agent {
    position: absolute;
    width: 42px;
    height: 42px;
    font-size: 28px;
    text-align: center;
    line-height: 42px;
    transition: left 0.8s ease-in-out, top 0.8s ease-in-out;
    z-index: 5;
    filter: drop-shadow(0 0 8px var(--laser-glow));
  }

  #bubble {
    position: absolute;
    max-width: 230px;
    background: #0a1830;
    border: 1px solid var(--laser);
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 11px;
    line-height: 1.5;
    z-index: 6;
    transition: left 0.8s ease-in-out, top 0.8s ease-in-out, opacity 0.2s;
    opacity: 0;
    box-shadow: 0 0 16px var(--laser-glow);
  }
  #bubble::after {
    content: "";
    position: absolute;
    bottom: -9px;
    left: 24px;
    border-width: 9px 7px 0 7px;
    border-style: solid;
    border-color: var(--laser) transparent transparent transparent;
  }
  #bubble.show { opacity: 1; }
  #bubble .b-action { font-weight: 700; color: var(--laser); text-shadow: 0 0 6px var(--laser-glow); }
  #bubble .b-contradiction {
    color: var(--danger); font-weight: 700; margin-top: 4px; display: block;
    text-shadow: 0 0 6px var(--danger-glow);
  }

  .controls { display: flex; align-items: center; gap: 12px; font-size: 12px; margin-bottom: 16px; }
  button {
    font-family: var(--mono); font-size: 12px;
    background: var(--panel);
    color: var(--laser);
    border: 1px solid var(--laser-soft);
    padding: 8px 16px;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  button:hover:not(:disabled) { border-color: var(--laser); box-shadow: 0 0 12px var(--laser-glow); }
  button:disabled { color: #3a4a63; border-color: #16305c; cursor: not-allowed; }
  #stepLabel { color: var(--text-dim); }

  #logLine {
    font-size: 12px;
    color: var(--text-dim);
    border: 1px solid var(--panel-line);
    padding: 10px 14px;
    background: var(--panel);
  }
  #logLine .hl { color: var(--laser); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Track 1 — World Modeling for Autonomous Agents</div>
    <h1>MAP REPLAY // BELIEF-GRAPH</h1>
    <div class="subtitle">Autonomous agent trace — no history, only current world slice.</div>
  </header>

  <div class="status-line" id="loadStatus">Loading trace data...</div>

  <div id="stage"></div>

  <div class="controls">
    <button id="prevBtn" disabled>&larr; PREV</button>
    <button id="playBtn" disabled>&#9654; PLAY</button>
    <button id="nextBtn" disabled>NEXT &rarr;</button>
    <span id="stepLabel">Step 0 / 0</span>
  </div>

  <div id="logLine">Loading trace data...</div>

</div>

<!--
  This script tag loads the trace generated automatically by main.py.
  Unlike fetch(), a <script src> tag works with a plain double-click
  (file:// protocol) - no local server needed. TRACE_DATA is defined
  inside run_trace_data.js as: const TRACE_DATA = [ ... ];
-->
<script src="run_trace_data.js"></script>

<script>
  const ROOM_LAYOUT = {
    entrance_hall: { x: 60,  y: 300, label: "Entrance Hall" },
    garden:        { x: 60,  y: 100, label: "Garden" },
    kitchen:       { x: 330, y: 300, label: "Kitchen" },
    cellar:        { x: 330, y: 100, label: "Cellar" },
    study:         { x: 600, y: 300, label: "Study" },
  };

  const CORRIDORS = [
    { from: "entrance_hall", to: "kitchen" },
    { from: "entrance_hall", to: "garden" },
    { from: "kitchen", to: "cellar" },
    { from: "kitchen", to: "study" },
  ];

  let trace = [];
  let currentIndex = -1;
  let playing = false;
  let playTimer = null;

  window.addEventListener('DOMContentLoaded', function() {
    if (typeof TRACE_DATA === 'undefined' || TRACE_DATA.length === 0) {
      document.getElementById('loadStatus').textContent =
        'No trace data found. Run "python main.py" first, then reopen this file.';
      document.getElementById('loadStatus').className = 'status-line err';
      document.getElementById('logLine').textContent = 'Waiting for run_trace_data.js ...';
      return;
    }
    trace = TRACE_DATA;
    document.getElementById('loadStatus').textContent =
      'Loaded ' + trace.length + ' steps from latest run \u2713';
    document.getElementById('loadStatus').className = 'status-line ok';
    buildStage();
    currentIndex = -1;
    renderStep();
    document.getElementById('prevBtn').disabled = false;
    document.getElementById('nextBtn').disabled = false;
    document.getElementById('playBtn').disabled = false;
  });

  function buildStage() {
    const stage = document.getElementById('stage');
    stage.innerHTML = '';

    CORRIDORS.forEach(function(c) {
      const a = ROOM_LAYOUT[c.from];
      const b = ROOM_LAYOUT[c.to];
      const ax = a.x + 95, ay = a.y + 65;
      const bx = b.x + 95, by = b.y + 65;
      const div = document.createElement('div');
      div.className = 'corridor';
      if (ay === by) {
        div.style.left = Math.min(ax, bx) + 'px';
        div.style.top = (ay - 3) + 'px';
        div.style.width = Math.abs(bx - ax) + 'px';
        div.style.height = '6px';
      } else {
        div.style.left = (ax - 3) + 'px';
        div.style.top = Math.min(ay, by) + 'px';
        div.style.width = '6px';
        div.style.height = Math.abs(by - ay) + 'px';
      }
      stage.appendChild(div);
    });

    Object.keys(ROOM_LAYOUT).forEach(function(name) {
      const r = ROOM_LAYOUT[name];
      const box = document.createElement('div');
      box.className = 'room-box';
      box.id = 'room-' + name;
      box.style.left = r.x + 'px';
      box.style.top = r.y + 'px';
      box.innerHTML = '<div class="room-label">' + r.label + '</div>';
      stage.appendChild(box);
    });

    const agent = document.createElement('div');
    agent.id = 'agent';
    agent.textContent = '\u{1F9CD}';
    stage.appendChild(agent);

    const bubble = document.createElement('div');
    bubble.id = 'bubble';
    stage.appendChild(bubble);
  }

  function positionAt(roomName) {
    const r = ROOM_LAYOUT[roomName];
    const agent = document.getElementById('agent');
    const bubble = document.getElementById('bubble');
    const agentX = r.x + 95 - 21;
    const agentY = r.y + 65 - 21;
    agent.style.left = agentX + 'px';
    agent.style.top = agentY + 'px';
    bubble.style.left = Math.max(4, agentX - 90) + 'px';
    bubble.style.top = (agentY - 78) + 'px';
  }

  function clearHighlights() {
    document.querySelectorAll('.room-box').forEach(function(el) {
      el.classList.remove('current-room', 'flash');
    });
  }

  function renderStep() {
    if (trace.length === 0) return;
    clearHighlights();
    const bubble = document.getElementById('bubble');

    if (currentIndex === -1) {
      positionAt('entrance_hall');
      document.getElementById('room-entrance_hall').classList.add('current-room');
      bubble.classList.remove('show');
      document.getElementById('stepLabel').textContent = 'Step 0 / ' + trace.length + ' (start)';
      document.getElementById('logLine').innerHTML =
        '<span class="hl">[START]</span> Agent begins in the Entrance Hall. Objective: reach the study.';
      return;
    }

    const entry = trace[currentIndex];
    const roomAfter = entry.room_after;

    positionAt(roomAfter);
    const roomEl = document.getElementById('room-' + roomAfter);
    roomEl.classList.add('current-room');

    let bubbleHtml = '<span class="b-action">' + entry.action + '</span>';
    if (entry.contradiction) {
      bubbleHtml += '<span class="b-contradiction">\u26A0 ' + entry.contradiction.old_value +
        ' \u2192 ' + entry.contradiction.new_value + '!</span>';
      roomEl.classList.add('flash');
    }
    bubble.innerHTML = bubbleHtml;
    bubble.classList.add('show');

    document.getElementById('stepLabel').textContent = 'Step ' + (currentIndex + 1) + ' / ' + trace.length;
    document.getElementById('logLine').innerHTML =
      '<span class="hl">[STEP ' + entry.step + ']</span> "' + entry.action + '" \u2192 ' + entry.response;
  }

  document.getElementById('nextBtn').addEventListener('click', function() {
    if (currentIndex < trace.length - 1) { currentIndex++; renderStep(); }
  });
  document.getElementById('prevBtn').addEventListener('click', function() {
    if (currentIndex > -1) { currentIndex--; renderStep(); }
  });
  document.getElementById('playBtn').addEventListener('click', function() {
    if (playing) {
      playing = false;
      clearInterval(playTimer);
      document.getElementById('playBtn').innerHTML = '&#9654; PLAY';
      return;
    }
    playing = true;
    document.getElementById('playBtn').innerHTML = '&#10074;&#10074; PAUSE';
    playTimer = setInterval(function() {
      if (currentIndex < trace.length - 1) {
        currentIndex++; renderStep();
      } else {
        playing = false;
        clearInterval(playTimer);
        document.getElementById('playBtn').innerHTML = '&#9654; PLAY';
      }
    }, 1600);
  });
</script>
</body>
</html>
